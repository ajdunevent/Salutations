[package]
name = "salutations"
version = "0.1.3"
description = "A small GTK4/libadwaita IMAP mail client for GNOME Online Accounts"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
salutations-core = { path = "../salutations-core" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
futures-channel = "0.3"
sourceview5 = "0.11"
libspelling = "0.5"
webkit = { package = "webkit6", version = "0.6", features = ["v2_50"] }

[build-dependencies]
glib-build-tools = "0.22"
